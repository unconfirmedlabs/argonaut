name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ".go-version"
          check-latest: true
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ".go-version"
          check-latest: true
          cache: true
      - run: scripts/repro-build.sh --skip-docker --out dist/repro-a
      - run: scripts/repro-build.sh --skip-docker --out dist/repro-b
      - run: cmp dist/repro-a/bin/argonaut-linux-amd64 dist/repro-b/bin/argonaut-linux-amd64
      - run: cmp dist/repro-a/rootfs.tar dist/repro-b/rootfs.tar
      - run: cmp dist/repro-a/context.tar dist/repro-b/context.tar
